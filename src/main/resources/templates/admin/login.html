<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Login | Shubham Kumar Rai Portfolio', 'Secure administrator login for portfolio management.')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('admin')}"></header>

<main class="section-block" style="min-height: 76vh; display: grid; place-items: center;">
    <div class="container-custom" style="max-width: 460px;">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="skill-icon-box mx-auto mb-3">
                    <i data-lucide="shield-lock" style="width:22px;height:22px;"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">Admin Sign In</h1>
                <p style="color: var(--text-secondary); font-size: 0.92rem;">
                    Manage portfolio projects, certificates, and contact messages.
                </p>
            </div>

            <div th:if="${param.error}" class="alert-banner alert-error-custom">
                Invalid username or password. Please try again.
            </div>
            <div th:if="${param.logout}" class="alert-banner alert-success-custom">
                You have been signed out securely.
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="form-field">
                    <label for="username" class="form-label-custom">Username</label>
                    <input id="username" name="username" type="text" class="form-input-custom" placeholder="admin" required autofocus/>
                </div>
                <div class="form-field">
                    <label for="password" class="form-label-custom">Password</label>
                    <input id="password" name="password" type="password" class="form-input-custom" placeholder="••••••••" required/>
                </div>
                <button type="submit" class="btn-primary-gradient w-100 mt-2">
                    <i data-lucide="log-in" style="width:16px;height:16px;"></i>
                    <span>Sign In to Dashboard</span>
                </button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
